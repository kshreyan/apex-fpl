name: FPL Pipeline Healthcheck

# Deliberately separate from pipeline.yml, on its own weekly schedule --
# see pipeline/healthcheck.py's module docstring for what this catches
# that a green daily run cannot (Pages source drifting, a corrupted
# commit-SHA cache, the schedule itself going stale) and the one thing
# it structurally can't catch (GitHub disabling every scheduled workflow
# in this repo at once, including this one).
#
# 08:17 UTC Monday, not a round hour, for the same scheduler-congestion
# reason as pipeline.yml's cron comment.
"on":
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fpl-healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # check_blame_cache_integrity needs real history to re-blame
          # against, for the same reason build_site.py does.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run health checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline.healthcheck

      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Healthcheck failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="The weekly healthcheck failed: $RUN_URL. See the run log for which specific check(s) failed, and RUNBOOK.md for how to triage each one."
          existing=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
