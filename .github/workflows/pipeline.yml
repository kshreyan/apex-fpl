name: FPL Pipeline

# Runs daily; the schedule only decides WHEN to check in, not whether to
# act -- pipeline/predict.py's own phase/deadline gating (see gw_state.py)
# is what actually decides whether a prediction gets made this run. Never
# hardcode a gameweek deadline here or anywhere else.
#
# 06:23 UTC, not a round hour: GitHub's scheduler is heavily congested at
# the top of every hour (this is documented, common advice, not a guess),
# and an off-hour minute meaningfully reduces queuing delay for free.
# Still comfortably after evening kickoffs finish (~23:00 UTC the same or
# previous day) and their bonus-point confirmation window, and well
# before the earliest realistic deadline (always at least 90 minutes
# before a gameweek's first kickoff, never earlier than Friday evening UK
# time).
#
# workflow_dispatch is required by this project's own non-negotiables,
# not just convenience -- it's how Gate verification and RUNBOOK-driven
# manual recovery both work.
#
# Second schedule, hourly (Phase 13 Block 1.6): press conferences and
# late fitness tests land inside the final 24h before a deadline, and a
# once-daily check can be stale by exactly the window that matters most.
# Running the full pipeline (deps, test suite, model) every hour, all
# day, every day, purely on the chance a deadline is close would be
# wasteful and would flood the commit history -- so this tick starts
# with pipeline/should_run_now.py, a single cheap probe fetch, and only
# proceeds to the expensive steps if a deadline is genuinely within 24h.
# The daily anchor tick (identified by github.event.schedule below) and
# manual dispatch always run in full, unconditionally -- they cover
# settlement detection and calibration freshness, which don't depend on
# deadline proximity at all.
"on":
  schedule:
    - cron: "23 6 * * *"
    - cron: "37 * * * *"
  workflow_dispatch: {}

# Least privilege at the workflow level; each job below grants itself
# only what it actually needs.
permissions:
  contents: read

# Serializes runs of the whole workflow (queue, don't cancel) rather than
# letting a manual dispatch race a scheduled run's git push, or race two
# deployments to the github-pages environment, against each other.
# cancel-in-progress is spelled out explicitly, not left to default to
# false implicitly -- the push semantics here depend on it.
concurrency:
  group: fpl-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    outputs:
      docs-changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # pipeline/site/git_commits.py resolves each prediction/result
          # line to its commit via `git blame` -- a shallow checkout would
          # attribute every pre-existing line to the single grafted commit
          # and silently break every "proof this preceded the deadline"
          # link on the site.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Determine whether this tick runs the full pipeline
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" == "23 6 * * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Always running: manual dispatch or the daily anchor schedule."
          else
            result=$(python -m pipeline.should_run_now)
            echo "should_run=$result" >> "$GITHUB_OUTPUT"
            echo "Hourly tick outside the daily anchor -- pipeline.should_run_now says: $result"
          fi

      - name: Run test suite
        # A regression here must block the run before it ever touches
        # live data or publishes anything -- this is the "fail loudly,
        # never publish a partial or fallback prediction" rule applied
        # one step earlier than the pipeline itself.
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pytest -q

      - name: Run predict.py
        id: predict
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set +e
          python -m pipeline.predict
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "::warning title=Deadline missed::predict.py refused to run within its safety margin of the deadline -- this gameweek's prediction window has closed with nothing published."
          elif [ "$code" -ne 0 ]; then
            echo "::error title=predict.py failed::Exit code $code -- see the step log above. No partial prediction was written."
            exit "$code"
          fi

      - name: Run predict_transfers.py
        id: predict-transfers
        # Deliberately never blocks the pipeline: this is a newer,
        # structurally separate capability (Phase 13 Block 2.5) from the
        # core squad prediction above, which has already succeeded and
        # committed by this point. A bug here must not cost a real
        # deadline for the thing this whole project's credibility rests
        # on -- logged loudly as a warning annotation on failure, never
        # propagated as a job failure.
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set +e
          python -m pipeline.predict_transfers
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Transfer recommendation failed::predict_transfers.py exited $code -- the core squad prediction above already succeeded and is unaffected. See the step log."
          fi
          exit 0

      - name: Run predict_chips.py
        id: predict-chips
        # Same never-blocks-the-pipeline discipline as predict_transfers.py
        # above (Phase 13 Block 2.8 (a)) -- a newer, structurally separate
        # capability, not allowed to cost the core squad prediction a real
        # deadline if it has a bug.
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set +e
          python -m pipeline.predict_chips
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Chip recommendation failed::predict_chips.py exited $code -- the core squad prediction above already succeeded and is unaffected. See the step log."
          fi
          exit 0

      - name: Run predict_field.py
        id: predict-field
        # Same never-blocks-the-pipeline discipline as predict_transfers.py
        # and predict_chips.py above -- this is a validation harness (item
        # 5 of the "explicitly disclosed, not built" gaps), not a live
        # decision feature, so it must never cost the core squad
        # prediction a real deadline if it has a bug.
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set +e
          python -m pipeline.predict_field
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Field-simulation prediction failed::predict_field.py exited $code -- the core squad prediction above already succeeded and is unaffected. See the step log."
          fi
          exit 0

      - name: Run predict_rank_aware.py
        id: predict-rank-aware
        # Same never-blocks-the-pipeline discipline as the other
        # predict_*.py steps above -- item 3 of the "explicitly
        # disclosed, not built" gaps (the biggest and most novel), an
        # informational-only artifact, not a replacement for predict.py's
        # own squad, so a bug here must never cost a real deadline.
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set +e
          python -m pipeline.predict_rank_aware
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Rank-aware prediction failed::predict_rank_aware.py exited $code -- the core squad prediction above already succeeded and is unaffected. See the step log."
          fi
          exit 0

      - name: Open an issue for a missed deadline
        # Exit 3 leaves the run green -- a log annotation on a green run
        # is functionally silent, and this is the worst case the daily
        # check can hit: the last chance to predict this gameweek is
        # gone. The permanent record (gameweek page + calibration
        # history) follows automatically once metrics.py sees the
        # deadline has actually passed with no prediction on file -- see
        # CLAUDE.md -- but that's a same-or-next-run data fact, not an
        # alert. This step is the alert.
        if: steps.predict.outputs.exit_code == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Missed a gameweek prediction deadline"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="predict.py refused to run within its safety margin of the deadline (exit code 3). This gameweek's prediction window has closed with nothing published -- it will show as a permanent gap on that gameweek's page and in the calibration history once its deadline has fully passed and the next run confirms it. Run: $RUN_URL"
          existing=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      - name: Commit and push the prediction
        id: commit-predict
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git add data/predictions data/transfer_recommendations data/chip_observations data/field_simulation_predictions data/rank_aware_predictions data/raw
          if git diff --cached --quiet; then
            echo "No new prediction this run -- skipping commit."
          else
            # Committed and pushed immediately, separately from the
            # scoring/site commit below. Found in Stage 7 review: with a
            # single end-of-run commit, a bug in score.py while scoring
            # some UNRELATED gameweek would abort the job before this
            # already-computed, time-sensitive prediction ever got
            # committed -- a scoring bug three gameweeks away from this
            # one could cost a real deadline. Splitting the commit means
            # the prediction is safe on origin the moment it exists,
            # regardless of what happens next in this run.
            git commit -m "Automated pipeline run: prediction ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase
            git push
          fi

      - name: Run score.py
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pipeline.score

      - name: Run check_execution_divergence.py
        # Same never-blocks-the-pipeline discipline as predict_transfers.py
        # and predict_chips.py above -- checking a settled gameweek's real
        # entry picks against what was published must not cost the site
        # build if it has a bug. Runs alongside score.py: both act only on
        # already-settled gameweeks, not on this run's live deadline.
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set +e
          python -m pipeline.check_execution_divergence
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Execution-divergence check failed::check_execution_divergence.py exited $code -- scoring and the site build above are unaffected. See the step log."
          fi
          exit 0

      - name: Run validate_field_simulation.py
        # Same never-blocks-the-pipeline discipline as check_execution_
        # divergence.py above -- the second half of item 5 (external
        # validation of the field/rank simulator), acting only on
        # already-settled gameweeks alongside score.py, not on this run's
        # live deadline.
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set +e
          python -m pipeline.validate_field_simulation
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Field-simulation validation failed::validate_field_simulation.py exited $code -- scoring and the site build above are unaffected. See the step log."
          fi
          exit 0

      - name: Rebuild data/calibration.json
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pipeline.metrics

      - name: Rebuild the site
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pipeline.build_site

      - name: Commit and push scoring + site updates
        id: commit
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing changed -- skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # data/calibration.json's rebuilt_at_utc advances on every
            # successful run even on a quiet day, so in practice this
            # branch is the normal path, not the exception -- see
            # CLAUDE.md for why that's deliberate, not a bug.
            git commit -m "Automated pipeline run: scoring + site ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Rebases our new commit onto anything pushed since checkout
            # (e.g. a manual commit made mid-run, or this same run's own
            # prediction commit above) instead of failing on a plain
            # non-fast-forward push.
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the built site
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: pipeline
    # Skips the (rare) run where nothing changed at all -- see
    # CLAUDE.md on why that's nearly always false in practice, since
    # rebuilt_at_utc advances on every successful run.
    if: needs.pipeline.outputs.docs-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  notify-on-failure:
    needs: [pipeline, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="FPL Pipeline run failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="A scheduled or manual pipeline run failed: $RUN_URL"
          existing=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
