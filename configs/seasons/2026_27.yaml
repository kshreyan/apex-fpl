# APEX FPL — Season rule configuration
# Every rule carries its own source and retrieval date, per spec Part III.
# Primary source: live fantasy.premierleague.com/api/bootstrap-static/ response,
# fetched and parsed directly in this session (2026-08-14) — element_types,
# game_config.rules, game_config.scoring, chips, events. This is the
# authoritative game-engine configuration, not a secondary interpretation.
# Secondary sources (premierleague.com/en/news articles + independent blogs,
# cross-corroborated) fill gaps the bootstrap-static payload doesn't expose
# (BPS action-weight matrix, price-change/GW-lockdown timing narrative).
# fantasy.premierleague.com/help/rules is JS-rendered and could not be
# fetched directly; bootstrap-static supersedes it as ground truth anyway.

season: "2026/27"
config_version: 2
retrieved_at: "2026-08-14"
season_status: >
  NOT YET STARTED as of retrieval. GW1 deadline confirmed live from the API:
  2026-08-21T17:30:00Z (7 days after this config was written). is_current=false,
  is_next=true for event id 1. This means zero prospective 2026/27 snapshots
  exist yet — Phase 1 snapshot capture must begin before 2026-08-21T17:30:00Z
  to have any pre-deadline GW1 data at all.

squad:
  budget: 100.0
  currency: "GBPm"
  budget_raw_units: 1000          # game_config.rules.squad_total_spend
  currency_multiplier: 10         # game_config.rules.ui_currency_multiplier (budget = raw/multiplier)
  squad_size: 15                  # game_config.rules.squad_squadsize
  quotas: {GK: 2, DEF: 5, MID: 5, FWD: 3}   # element_types[*].squad_select
  max_players_per_club: 3         # game_config.rules.squad_team_limit
  starting_xi_size: 11            # game_config.rules.squad_squadplay
  starting_xi_min: {GK: 1, DEF: 3, MID: 2, FWD: 1}   # element_types[*].squad_min_play
  starting_xi_max: {GK: 1, DEF: 5, MID: 5, FWD: 3}   # element_types[*].squad_max_play
  element_type_counts_live: {GK: 65, DEF: 193, MID: 259, FWD: 70}  # element_count, informational only (player pool size, not a rule)
  source: "https://fantasy.premierleague.com/api/bootstrap-static/ (element_types, game_config.rules)"
  verification_status: confirmed_from_api
  notes: >
    Formation legality is derived from starting_xi_min/max per position, not
    a fixed enumerated list — any XI satisfying those bounds (and summing to
    11) is legal. The optimizer must implement it this way, not via an enum.

scoring:
  # game_config.scoring, confirmed directly from the live API response.
  appearance:
    under_60_min: 1   # scoring.short_play
    at_least_60_min: 2  # scoring.long_play
  goals_scored: {GK: 10, DEF: 6, MID: 5, FWD: 4}      # scoring.goals_scored
  assist: 3                                            # scoring.assists
  clean_sheet: {GK: 4, DEF: 4, MID: 1, FWD: 0}         # scoring.clean_sheets
  clean_sheet_min_minutes: 60
  goals_conceded: {GK: -1, DEF: -1, MID: 0, FWD: 0}    # scoring.goals_conceded (per-unit value; divisor below)
  goals_conceded_divisor: 2      # standard FPL rule (-1 per 2 conceded); NOT explicitly present in the API's scoring dict, which gives per-unit point value only — treat divisor as needs_confirmation until seen applied to a live finalized score
  saves: 1                       # scoring.saves (per-unit point value)
  saves_divisor: 3               # standard FPL rule (1pt per 3 saves); same caveat as goals_conceded_divisor
  penalty_save: 5                # scoring.penalties_saved
  penalty_miss: -2               # scoring.penalties_missed
  yellow_card: -1                # scoring.yellow_cards
  red_card: -3                   # scoring.red_cards
  own_goal: -2                   # scoring.own_goals
  bonus_per_bps_rank: {first: 3, second: 2, third: 1}  # scoring.bonus=1 is a multiplier; standard 3/2/1 award by BPS rank, ties can award equal points per official mechanism
  defensive_contribution:
    DEF: {threshold_actions: 10, actions: ["clearances", "blocks", "interceptions", "tackles"], points: 2}
    MID: {threshold_actions: 12, actions: ["clearances", "blocks", "interceptions", "tackles", "recoveries"], points: 2}
    FWD: {threshold_actions: 12, actions: ["clearances", "blocks", "interceptions", "tackles", "recoveries"], points: 2}
    GK: null   # scoring.defensive_contribution.GKP == 0 — CONFIRMED excluded, resolves prior open gap
    cap_per_match: 2
    source_note: >
      Confirmed via scoring.defensive_contribution = {DEF:2, MID:2, FWD:2, GKP:0}
      directly from the API. Threshold action counts (10/12) and the specific
      action set (CBIT vs CBIRT) are NOT present in bootstrap-static's scoring
      dict — those come from element_stats field names
      (clearances_blocks_interceptions, recoveries, tackles, defensive_contribution)
      cross-corroborated with premierleague.com/news and draftfantasy.com.
  verification_status: confirmed_from_api
  source: "https://fantasy.premierleague.com/api/bootstrap-static/ (game_config.scoring)"

bps_2026_27_changes:
  # game_config.scoring shows tackles / clearances_blocks_interceptions /
  # recoveries all = 0 as DIRECT scoring-table entries (they feed
  # defensive_contribution and the separate BPS calc, not direct points).
  # The full per-action BPS weight matrix is not exposed by bootstrap-static
  # at all (BPS is computed server-side from underlying match-stats feeds
  # not present in this endpoint) — this remains a genuine gap, not
  # something the API resolved.
  tackled_penalty_removed: true
  cbi_weighting: "1 BPS per 3 qualifying actions (was 1 per 2)"
  gk_saves: "2 BPS per save (any); +1 in-box; +1 big-chance save; penalty save 7 BPS per this article"
  stated_intent: "reduce overlap between BPS and defensive-contribution points; improve bonus prospects for GKs, full-backs, attackers"
  source: "https://www.premierleague.com/en/news/4679946/whats-new-in-202627-fantasy-changes-to-bonus-points-system"
  verification_status: needs_further_confirmation
  full_matrix_available: false
  resolution_plan: >
    Full BPS matrix is not obtainable from bootstrap-static. Must reconcile
    empirically once GW1 finishes: pull element-summary / event/{id}/live
    bps field, regress against clearances_blocks_interceptions/tackles/
    recoveries/saves/goals/etc. to recover implied per-action weights, or
    find the official published BPS reference table.

transfers:
  free_transfers_per_gw: 1
  max_extra_free_transfers: 4          # game_config.rules.max_extra_free_transfers
  max_banked_free_transfers: 5          # derived: 1 current + 4 bankable extra
  hit_cost_per_extra_transfer: -4
  max_transfers_per_gw: 20              # game_config.rules.transfers_cap
  sell_on_fee: 0.5                      # game_config.rules.transfers_sell_on_fee
  element_sell_at_purchase_price: false # game_config.rules.element_sell_at_purchase_price
  source: "https://fantasy.premierleague.com/api/bootstrap-static/ (game_config.rules)"
  verification_status: confirmed_from_api

