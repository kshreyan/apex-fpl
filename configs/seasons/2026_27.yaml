price_changes:
  timing: "midnight UK time"
  sell_price_rule: "purchase price + floor(sell_on_fee * price rise); no protection against price falls"
  sell_on_fee: 0.5
  source: "https://fantasy.premierleague.com/api/bootstrap-static/ (transfers_sell_on_fee) + https://worldinsport.com/fantasy-premier-league-rules-scoring/ (narrative)"
  verification_status: confirmed_from_api

gameweek_timing:
  score_finalization: "09:00 UK time, day after the last match of the gameweek (changed from 1hr after final whistle in prior seasons)"
  bonus_points_live_projection: "provisional bonus added ~20 minutes into each match, adjusts live until finalization"
  reason: "additional time for Opta post-match data review, feeding BPS and defensive contributions"
  gw1_deadline_utc: "2026-08-21T17:30:00Z"   # confirmed live from events[0].deadline_time
  source: "https://www.premierleague.com/en/news/4679873/all-you-need-to-know-about-changes-to-fpl-for-202627"
  source_gw1_deadline: "https://fantasy.premierleague.com/api/bootstrap-static/ (events[0])"
  verification_status: needs_further_confirmation
  implementation_note: >
    Operationally critical: any snapshot taken before 09:00 UK the day after
    the final GW match is PROVISIONAL, not final. Bronze-layer snapshots
    must record retrieved_at and an is_finalized flag (derived from
    events[i].data_checked / finished) so Gold-layer features never treat
    provisional BPS/DC/points as ground truth for training.

unresolved_gaps:
  items:
    - "Full BPS point-per-action weight matrix (bootstrap-static does not expose it; must be reverse-engineered from event/{id}/live once GW1 finishes, or a primary published table found)"
    - "Auto-substitution rule text (priority order, formation-legality checks) — not in bootstrap-static, needs fantasy.premierleague.com/help/rules or a rendered fetch"
    - "Exact double/blank gameweek fixture calendar for 2026/27 — needs /api/fixtures/ ingestion in Phase 1"
    - "goals_conceded_divisor=2 and saves_divisor=3 are standard historical FPL rules, not explicitly present as divisors in this season's scoring payload (only per-unit point values are) — treat as needs_confirmation until validated against a live finalized gameweek score"
    - "Free Hit GW19/GW20 double-restriction — sourced only from a secondary blog, not independently visible in the chips array"
  resolution_plan: >
    Phase 1 ingestion of /api/fixtures/, /api/event/{id}/live/, and
    /api/element-summary/{id}/ closes the fixture-calendar and BPS-matrix
    gaps empirically. Auto-sub rules require either a rendered fetch of
    fantasy.premierleague.com/help/rules or reconstruction by observing
    actual auto-substitutions applied after a live gameweek.
