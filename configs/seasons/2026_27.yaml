  first_set_carryover_to_second_half: false
  free_hit_gw19_gw20_restriction: "if played GW19, cannot be played again GW20 (secondary source; not independently visible in chips array structure, needs Phase 1 confirmation once event 19/20 data is live)"
  source_structure: "https://fantasy.premierleague.com/api/bootstrap-static/ (chips array)"
  source_narrative: "https://www.premierleague.com/en/news/4679879/whats-happening-with-fpl-chips-in-202627"
  verification_status: confirmed_from_api_partial
  notes: >
    Corrects an earlier draft of this config: only Free Hit was previously
    flagged as GW1-restricted. The API confirms Wildcard is ALSO
